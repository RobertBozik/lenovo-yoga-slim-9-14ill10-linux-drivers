# SPDX-License-Identifier: CC0-1.0
#
# Software ISP tuning for the OmniVision OV32C4 as fitted to the Lenovo
# Yoga Slim 9 14ILL10 (83CX), where the sensor sits under the OLED panel.
# For libcamera's softisp IPA.
#
# NOTHING HERE IS A GUESS.  Every number was either measured on this
# camera or decoded from the tuning data that shipped with the module;
# each block says which, and the chapter numbers refer to the project
# notes.
#
# The order the values are applied in is the one softisp uses:
# black level, lens shading, white balance gains, colour matrix, gamma.

%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      # 4096 on 16 bits = 64 on the sensor's 10 bits.  Measured with the
      # lens covered (chapters 35, 37) and independently confirmed by the
      # Windows tuning data (black_level_global 63.5-64.4).
      blackLevel: 4096
      # Veil of scattered light (patch 0011).  The panel above the lens
      # scatters light into it; 85 % of the brightness of the 0.5
      # percentile is treated as a neutral veil and subtracted per
      # channel (1/g_c) above the black level, smoothed with an IIR of
      # 0.1.
      veilStrength: 0.85
      veilPercentile: 0.5
      veilMax: 0.05
  # Lens shading correction (patch 0008, chapter 52).  Measured on a
  # white wall at 1.5 m, ten frames, exposure 2582, gain 1984, pedestal
  # 64, on a 32x18 grid of raw cells.  The R/G and B/G ratios were then
  # corrected by the residual measured on a wall in a real scene, twice
  # (daylight plus lamp, and lamp only) - the colour shading depends on
  # the light (chapter 52.4); these are the evening-lamp numbers.
  # Centre is 1.0, the corners need roughly R 3.8x, G 3.2x, B 3.7x.
  # Applied after black level subtraction and before white balance.
