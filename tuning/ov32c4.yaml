  - Awb:
      # Bayes AWB: the white point is searched for only along the curve of
      # illuminants below, so a face in frame cannot drag grey towards
      # green the way grey world does - measured, a white t-shirt came out
      # at R/G 0.81-0.85 (chapter 38.7).
      algorithm: bayes
      # Weight the statistics by zone (patch 0016): the grey point comes
      # from the bright, near-neutral zones (walls), not from the average
      # of the whole frame, so a face or a sofa no longer pulls it
      # (chapters 52.7, 54).
      zoneWeighting: true
      # How far off the curve the search may go, in r/b gain units.  The
      # default 0.01 is not enough: an evening LED lamp lies off the curve
      # and a wall stayed purple.  0.12 in B/G went too far the other way
      # and the picture turned blue (chapter 52.7).
      transversePos: 0.06
      transverseNeg: 0.06
      # Search range on the curve.  These keys are not kelvin - see the
      # colourGains comment below.
      AwbMode:
        AwbAuto:
          lo: 2680
          hi: 3850
      # One entry with a flat probability: no prior about the light
      # (softisp reports a constant lux of 500).
      priors:
        - lux: 500
          ct: [ 2680, 3850 ]
          probability: [ 1.0, 1.0 ]
      # The curve of white points for this sensor: 1/(R/G), 1/(B/G) per
      # illuminant, decoded from the module's tuning data.  The key `ct`
      # is NOT the colour temperature of the light - it is what
      # libcamera's own estimateCCT() returns for those raw ratios
      # (colours.cpp, McCamy over a generic rgb2xyz), because that is the
      # value the AWB hands on to the colour matrix.  The real
      # temperature is in the comment beside each entry.  A consequence:
      # the ColourTemperature metadata libcamera reports is off; fixing
      # that needs a sensor-specific rgb2xyz in libcamera itself.
      colourGains:
        - ct: 2680   # A 2756 K
          gains: [ 0.8966, 2.7660 ]
        - ct: 2728   # F4 2940 K
          gains: [ 0.9660, 3.2701 ]
        - ct: 3060   # F11 4000 K
          gains: [ 1.1723, 3.2350 ]
        - ct: 3127   # F2 3839 K
          gains: [ 1.2045, 3.1264 ]
        - ct: 3327   # D50 4782 K
          gains: [ 1.2959, 2.8302 ]
        - ct: 3555   # D65 5783 K
          gains: [ 1.4527, 2.6912 ]
        - ct: 3670   # D75 6449 K
          gains: [ 1.5282, 2.6026 ]
        # Extrapolated, not measured: one step past the coldest
        # illuminant, so that cool white light does not run off the
        # end of the curve and turn the picture blue (chapter 54).
        # OPEN: measure it with a grey card and replace it.
        - ct: 3850   # extrapolated, ~7500 K
          gains: [ 1.6037, 2.5140 ]
  # Colour correction matrices, decoded from the module's tuning data.
  # Rows sum to 1 (white stays white); applied after the white balance
  # gains in linear space.  Keyed on the same libcamera CT estimate as
  # the curve above.
  - Ccm:
      ccms:
        - ct: 2680   # A 2756 K
          ccm: [ 2.4568, -0.0822, -1.3746,
                 -0.5146, 2.1738, -0.6592,
                 -4.0571, -2.6282, 7.6854 ]
        - ct: 2728   # F4 2940 K
          ccm: [ 2.4825, -0.5146, -0.9680,
                 -0.4386, 2.1209, -0.6823,
                 -3.0735, -3.4903, 7.5638 ]
        - ct: 3060   # F11 4000 K
          ccm: [ 2.3126, -0.6585, -0.6542,
                 -0.3975, 2.0142, -0.6167,
                 -1.7040, -2.5127, 5.2167 ]
        - ct: 3127   # F2 3839 K
          ccm: [ 2.2526, -0.7466, -0.5060,
                 -0.3660, 2.2103, -0.8443,
                 -1.6008, -3.0756, 5.6764 ]
        - ct: 3327   # D50 4782 K
          ccm: [ 2.1411, -0.4773, -0.6638,
                 -0.3720, 2.0386, -0.6666,
                 -1.5672, -2.0603, 4.6275 ]
        - ct: 3555   # D65 5783 K
          ccm: [ 2.1556, -0.7309, -0.4246,
                 -0.3137, 2.0952, -0.7815,
                 -0.8465, -1.6817, 3.5281 ]
        - ct: 3670   # D75 6449 K
          ccm: [ 2.1689, -0.7281, -0.4408,
                 -0.3476, 2.1288, -0.7812,
                 -0.9462, -1.6825, 3.6286 ]
        - ct: 3850   # extrapolated, a copy of D75 (see Awb above)
          ccm: [ 2.1689, -0.7281, -0.4408,
                 -0.3476, 2.1288, -0.7812,
                 -0.9462, -1.6825, 3.6286 ]
  - Denoise:
      # Temporal noise reduction (patch 0007).  The noise model is
      # measured on this sensor: variance = noiseFloor + noiseSlope * signal
      # (chapter 39).  motionSigma is how many standard deviations of
      # noise a pixel may change before it is taken as motion rather than
      # noise.
      alpha: 0.25
      noiseSlope: 4.29e-05
      noiseFloor: 8.0e-09
      motionSigma: 2.5
  - Adjust:
      # Saturation (patch 0013).  The colour matrices render skin too red
      # (R/G 1.48 against 1.37 on a reference phone) and the chroma noise
      # at 15-20x digital gain is obvious.  Arrived at by eye against
      # that reference, in two steps (chapter 52.5).  The Saturation
      # control still overrides it.
      saturation: 0.65
      # Linear toe at black, sRGB style (patch 0010).  A pure power
      # function has infinite slope at zero and amplifies both noise and
      # the directional pattern in the shadows (chapters 40.4, 51).
      # 0 gives the original curve.
      gammaOffset: 0.055
  - Agc:
      # Digital gain in the ISP, once exposure (within the frame
      # duration) and the sensor's 7.75x analogue gain are exhausted.  It
      # adds no information and multiplies the noise, so the ceiling is a
      # policy, not a measurement (chapter 40.1).
      maxDigitalGain: 32.0
      # Highlight protection (patch 0009): keep the 85.0 percentile of
      # luminance, after digital gain and white balance, below 0.9 linear
      # (about 243 in sRGB).  Since the percentile metering below it is
      # only a backstop - it pulls down when 15 % of the centre is over
      # the limit times a hysteresis of 1.1.
      highlightLevel: 0.9
      highlightPercentile: 85.0
      # Default ceiling on the frame duration when the application sets
      # no FrameDurationLimits (pipewire 1.6.2 does not - chapter 41).
      # 66666 us = 15 fps.  Policy, not measurement; an application can
      # still ask for the full range.
      maxFrameDuration: 66666
      # Startup (patch 0014).  The sensor otherwise starts at a short
      # exposure and 1x gain, and the picture is black for seconds
      # (chapter 54).  These are indoor values; outdoors the AGC pulls
      # them down in one or two steps.
      startExposureTime: 66666
      startGain: 4.0
      # Metering (patch 0015): 70 % of the weight on the centre of the
      # frame (zones 4-11 x 2-6 of 16x9), and highlight protection on the
      # centre only - a window behind the subject may burn out, the face
      # may not (chapter 54).  0 meters the whole frame.
      meteringCentreWeight: 0.7
      # Meter a percentile rather than the mean (patch 0017): most of the
      # metered area (the face) is exposed to 0.18 linear, about 117 in
      # sRGB, and small bright areas no longer drag the average.
      # 0 restores the original mean-sample-value metering.
      meteringMedianTarget: 0.18
      # Which percentile (patch 0018): the median (50) aimed at the
      # background in a dark workshop and burnt out the face; 65.0 is the
      # brighter half of the subject.
      meteringPercentile: 65.0
      # Skin (patch 0019): zones the colour of skin (after white balance
      # and the colour matrix: R/G about 1.35, B/G about 0.90) are taken
      # to be the subject, and their brightness is metered with this
      # weight times a confidence that is full at 4 % of the frame.
      # Outdoors with the sky behind the subject the percentile fell into
      # the sky (chapter 55).  Highlight protection then protects the
      # skin (up to 0.55 linear) and lets the background burn out.
      meteringSkinWeight: 0.8
