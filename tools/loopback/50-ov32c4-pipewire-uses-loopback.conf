# WirePlumber, GNOME (Fedora): PipeWire applications get the camera from the
# loopback node (/dev/video42, "Lenovo OV32C4"), not from libcamera directly.
#
# GNOME applications (Camera, browsers through the camera portal) only use
# PipeWire. Straight from libcamera they ask for 1920x1080 or so, and the
# GPU debayer then scales down by sampling the raw image without averaging:
# colour streaks along moving edges. The feeder takes the full 3200x1800 and
# scales with Lanczos on the CPU, which is clean (measured 3 Nov 2026 on
# Fedora 45: gst-launch at 3200x1800 + videoscale clean, at 1920x1080 and
# 1280x720 streaks). The raw IPU7 capture nodes are hidden too; they would
# show up as unusable cameras once libcamera no longer claims them.
#
# On Kubuntu the opposite rule is installed (50-ov32c4-loopback-hide.conf).
monitor.libcamera.rules = [
  {
    matches = [ { device.name = "~libcamera_device.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
monitor.v4l2.rules = [
  {
    matches = [ { device.name = "~v4l2_device.pci-0000_00_05.0*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
