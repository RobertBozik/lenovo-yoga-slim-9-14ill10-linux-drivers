# WirePlumber: skry v4l2 loopback (Lenovo OV32C4, /dev/video42) pred
# PipeWire aplikaciami. Dovod (notes/06 kap. 44): cez PipeWire ma kameru
# ponukat len skutocny libcamera uzol; loopback je vstup pre v4l2
# aplikacie. Bez skrytia by aplikacie videli kameru dvakrat a dvaja
# libcamera klienti naraz dnes padaju (Chromium <=151 SIGFPE, wireplumber
# find-best-target.lua). device.name zmerane cez `wpctl inspect`
# (odvodene zo sysfs cesty; video_nr=42 je pevne v modprobe conf).
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "v4l2_device._sys_devices_virtual_video4linux_video42" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
