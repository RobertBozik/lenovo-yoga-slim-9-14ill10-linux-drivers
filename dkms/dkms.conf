# SPDX-License-Identifier: GPL-2.0
# DKMS package for the OV32C4 camera (Lenovo Yoga Slim 9 14ILL10).
# Two modules: the ov32c4 sensor driver and the patched ipu-bridge (the
# OVTI32C4 entry), both into /lib/modules/<kernel>/updates/dkms/, which
# depmod prefers over the distribution's own.  AUTOINSTALL rebuilds both
# after a kernel update.  Installed by: install.sh --step driver
PACKAGE_NAME="ov32c4-camera"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="ov32c4"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="ipu-bridge"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
